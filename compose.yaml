services:
    laravel.test:
        build:
            context: '.'
            dockerfile: docker/Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
                NODE_VERSION: '${NODE_VERSION:-24}'
        image: 'sail-8.4/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
            - '../packages_filament:/var/www/packages_filament'
        networks:
            sail:
            shared-db:
                # Son adresse pour les applications clientes de la TMA (TMA_MASTER_URL=http://filbreeze.test).
                aliases:
                    - filbreeze.test
        depends_on:
            - mysql
            - mailpit
    scheduler:
        image: 'sail-8.4/app'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
            - '../packages_filament:/var/www/packages_filament'
        networks:
            - sail
            - shared-db
        depends_on:
            - mysql
        command: php artisan schedule:work
    # Worker de file : envois vers les applications clientes (filament-tma), courriels en file.
    # queue:listen relit le code à chaque tâche (pratique en développement) ; en production, queue:work.
    queue:
        image: 'sail-8.4/app'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
            - '../packages_filament:/var/www/packages_filament'
        networks:
            - sail
            - shared-db
        depends_on:
            - mysql
            - mailpit
        restart: unless-stopped
        command: php artisan queue:listen --sleep=3 --timeout=120
    mysql:
        image: 'mysql:8.0.40'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            sail:
                # Un nom unique : sur le réseau partagé, « mysql » désigne aussi la base d'autres applications.
                aliases:
                    - filbreeze-mysql
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
networks:
    sail:
        driver: bridge
    # Le réseau partagé des applications de développement : la TMA y relie Filbreeze (centre de service) et ses clients.
    shared-db:
        name: '${SHARED_DB_NETWORK:-dev-shared-db}'
        driver: bridge
volumes:
    sail-mysql:
        driver: local
